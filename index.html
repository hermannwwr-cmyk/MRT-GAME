<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MRT Math Express</title>
<style>
  :root {
    --bg: #eaf6ff;
    --ink: #1d2b3a;
    --muted: #5b6b7c;
    --card: #ffffff;
    --line: #D42E12;
    --good: #2fa84f;
    --bad: #e0574a;
    --platform: #c9d3dc;
    --shadow: 0 4px 0 rgba(0,0,0,.15);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Comic Sans MS", "Chalkboard SE", "Baloo 2", system-ui, sans-serif;
    user-select: none;
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; }
  .screen { display: none; min-height: 100%; padding: 16px; max-width: 760px; margin: 0 auto; }
  .screen.active { display: flex; flex-direction: column; gap: 14px; }

  /* ---------- Home ---------- */
  h1 { font-size: clamp(28px, 7vw, 44px); margin: 8px 0 0; text-align: center; }
  .sub { text-align: center; color: var(--muted); margin: 0; font-size: 18px; }
  h2 { font-size: 20px; margin: 6px 0 0; }
  .lines { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .line-btn {
    background: var(--c); color: #fff; border-radius: 18px; padding: 14px 12px;
    text-align: left; box-shadow: var(--shadow); position: relative; min-height: 76px;
    outline: 4px solid transparent; outline-offset: 3px; transition: transform .1s;
  }
  .line-btn .code { font-size: 26px; font-weight: bold; display: block; }
  .line-btn .name { font-size: 14px; opacity: .95; }
  .line-btn .badge { position: absolute; top: 8px; right: 10px; font-size: 20px; }
  .line-btn.sel { outline-color: var(--ink); transform: scale(1.03); }
  .choices { display: flex; gap: 10px; flex-wrap: wrap; }
  .pill {
    flex: 1 1 140px; background: var(--card); border-radius: 18px; padding: 14px 10px;
    font-size: 20px; box-shadow: var(--shadow); outline: 4px solid transparent; outline-offset: 2px;
  }
  .pill small { display: block; font-size: 13px; color: var(--muted); }
  .pill.sel { outline-color: var(--ink); background: #fff7d6; }
  .go {
    background: var(--good); color: #fff; font-size: 30px; border-radius: 24px; padding: 16px;
    box-shadow: 0 6px 0 #1f7a37; margin-top: 6px;
  }
  .go:active { transform: translateY(4px); box-shadow: 0 2px 0 #1f7a37; }

  /* the start button is a train that pulls in, waits, and drives off when tapped */
  .start-hint { text-align: center; font-size: 20px; font-weight: bold; margin: 8px 0 0; }
  .start-hint span { display: inline-block; animation: point .6s ease-in-out infinite alternate; }
  @keyframes point { to { transform: translateY(6px); } }
  .start-track { position: relative; overflow: hidden; padding: 8px 0 16px; }
  .start-track::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 12px; background: repeating-linear-gradient(90deg, #6b5b4b 0 18px, #8b7b6b 18px 30px); border-radius: 3px; }
  .start-train {
    position: relative; z-index: 1; display: flex; gap: 6px; width: 100%; max-width: 560px; margin: 0 auto;
    padding: 0 0 20px; background: none; border-radius: 16px;
    animation: pullIn 1.6s cubic-bezier(.15,.75,.3,1) both;
  }
  .start-train:focus-visible { outline: 4px solid var(--ink); outline-offset: 4px; }
  .start-train.leaving { animation: driveOff 1.1s cubic-bezier(.55,0,.9,.45) forwards; }
  @keyframes pullIn { from { transform: translateX(-120vw); } to { transform: none; } }
  @keyframes driveOff { to { transform: translateX(120vw); } }
  .st-car {
    flex: 1; height: 86px; display: flex; align-items: center; gap: 6px; padding: 0 10px 14px;
    background: var(--line); border-radius: 14px; color: #fff;
    box-shadow: inset 0 -14px 0 rgba(0,0,0,.2), 0 4px 0 rgba(0,0,0,.15);
  }
  .start-train.waiting .st-car { animation: idle 1s ease-in-out infinite alternate; }
  .start-train.waiting .st-car:last-of-type { animation-delay: .15s; }
  @keyframes idle { to { transform: translateY(-3px); } }
  .st-win { flex: 1; height: 32px; background: #cfe9ff; border-radius: 6px; }
  .st-lead { flex: 2; border-radius: 14px 46px 14px 14px; justify-content: space-between; padding-right: 12px; }
  .st-text { font-size: clamp(22px, 6.5vw, 32px); font-weight: bold; white-space: nowrap; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .st-cab { flex: none; width: 26px; height: 36px; background: #2a3b4d; border-radius: 6px 18px 6px 6px; }
  .st-wheels { position: absolute; left: 7%; right: 7%; bottom: 2px; display: flex; justify-content: space-between; }
  .st-wheels i {
    width: 26px; height: 26px; border-radius: 50%; border: 5px solid #777;
    background: linear-gradient(90deg, transparent 42%, #aaa 42% 58%, transparent 58%), linear-gradient(0deg, transparent 42%, #aaa 42% 58%, transparent 58%), #333;
    animation: spin .5s linear infinite; animation-play-state: paused;
  }
  .start-train:not(.waiting) .st-wheels i { animation-play-state: running; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Game ---------- */
  .topbar { display: flex; align-items: center; gap: 8px; }
  .icon-btn { background: var(--card); border-radius: 14px; width: 48px; height: 48px; font-size: 24px; box-shadow: var(--shadow); flex: none; }
  .title-chip { flex: 1; background: var(--line); color: #fff; border-radius: 14px; padding: 10px 8px; font-size: 16px; font-weight: bold; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stars { font-size: 20px; background: var(--card); border-radius: 14px; padding: 10px 12px; box-shadow: var(--shadow); white-space: nowrap; }

  .route { position: relative; height: 54px; margin: 4px 10px 0; }
  .route .track { position: absolute; left: 0; right: 0; top: 18px; height: 8px; border-radius: 4px; background: var(--line); opacity: .35; }
  .route .done { position: absolute; left: 0; top: 18px; height: 8px; border-radius: 4px; background: var(--line); }
  .route .dot { position: absolute; top: 12px; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; background: #fff; border: 4px solid var(--line); }
  .route .dot.passed { background: var(--line); }
  .route .marker { position: absolute; top: -6px; margin-left: -16px; font-size: 28px; }
  .route .ends { position: absolute; top: 36px; left: 0; right: 0; display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .route .ends span { max-width: 45%; }

  .signrow { display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; }
  .music-pill { flex: none; align-self: center; font-size: 16px; padding: 8px 18px; }
  .icon-btn.off { opacity: .45; }
  .sign {
    align-self: center; background: #10253a; color: #fff; border-radius: 12px; padding: 8px 18px;
    font-size: 20px; display: flex; gap: 10px; align-items: center; border-bottom: 5px solid var(--line);
  }
  .sign .lbl { color: #9fb6cc; font-size: 14px; }

  .scene { position: relative; overflow: hidden; border-radius: 20px; background: linear-gradient(#bfe3ff, #e8f5ff 70%); padding: 64px 10px 0; min-height: 300px; }
  /* scenery layers scroll by background-position (set from JS while riding) */
  .layer { position: absolute; left: 0; right: 0; background-repeat: repeat-x; background-position: 0 100%; pointer-events: none; }
  .layer.far { top: 0; height: 110px; }
  .layer.near { top: 34px; height: 44px; }
  .train {
    position: relative; z-index: 1; margin: 0 auto; width: min(100%, 560px);
    display: flex; gap: 6px; align-items: stretch;
    background: #f4f6f8; border-radius: 26px 60px 14px 14px; padding: 12px 54px 22px 10px;
    box-shadow: inset 0 -10px 0 rgba(0,0,0,.06), 0 4px 0 rgba(0,0,0,.12);
  }
  .train::before { content: ""; position: absolute; left: 0; right: 0; bottom: 12px; height: 10px; background: var(--line); }
  .train::after { content: ""; position: absolute; right: 12px; top: 16px; width: 30px; height: 40px; background: #2a3b4d; border-radius: 6px 22px 6px 6px; }
  /* sliding doors: two leaves that slide apart to show the dark inside */
  .door { position: relative; flex: none; width: 30px; border-radius: 6px; background: #2a3b4d; overflow: hidden; }
  .door i { position: absolute; top: 0; bottom: 0; width: 50%; background: #dfe6ec; border: 2px solid #9fb0c0; transition: transform .6s ease-in-out; }
  .door i:first-child { left: 0; border-radius: 6px 0 0 6px; }
  .door i:last-child { right: 0; border-radius: 0 6px 6px 0; }
  .door i::after { content: ""; position: absolute; left: 3px; right: 3px; top: 8px; height: 26px; background: #cfe9ff; border-radius: 3px; }
  .train.open .door i:first-child { transform: translateX(-100%); }
  .train.open .door i:last-child { transform: translateX(100%); }
  .wheels { display: flex; justify-content: space-between; width: min(100%, 560px); margin: -10px auto 0; padding: 0 40px; position: relative; z-index: 2; }
  .wheels i {
    width: 26px; height: 26px; border-radius: 50%; border: 5px solid #777;
    background: linear-gradient(90deg, transparent 42%, #aaa 42% 58%, transparent 58%), linear-gradient(0deg, transparent 42%, #aaa 42% 58%, transparent 58%), #333;
  }
  .window {
    flex: 1; background: #cfe9ff; border-radius: 12px; min-height: 92px; padding: 6px;
    display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 2px;
    border: 4px solid #8aa2b8;
  }
  .rail { height: 10px; background: repeating-linear-gradient(90deg, #6b5b4b 0 18px, #8b7b6b 18px 30px); margin-top: 6px; }
  .platform { background: var(--platform); border-top: 6px solid #f2c94c; min-height: 72px; padding: 8px; display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; align-content: center; }
  .platform .note { color: var(--muted); font-size: 15px; }
  .tunnel {
    position: absolute; inset: 0; z-index: 3; opacity: 0; pointer-events: none;
    background: repeating-linear-gradient(90deg, transparent 0 140px, rgba(255,214,102,.55) 140px 150px), #0b1622;
  }

  .pax {
    position: relative; font-size: clamp(24px, 6vw, 34px); line-height: 1; padding: 2px; border-radius: 10px;
    background: none; transition: transform .5s, opacity .5s;
  }
  .pax.board { background: #fff2b3; box-shadow: 0 0 0 3px #f2c94c inset; }
  .pax.leaving { background: #ffd9d4; box-shadow: 0 0 0 3px var(--bad) inset; }
  .pax.leaving::after { content: "👋"; position: absolute; right: -6px; top: -10px; font-size: 16px; }
  .pax .n { position: absolute; left: 50%; top: -12px; transform: translateX(-50%); background: var(--ink); color: #fff; border-radius: 10px; font-size: 13px; padding: 1px 6px; }
  .pax.pop { animation: pop .4s ease-out; }
  @keyframes pop { from { transform: scale(0); } 60% { transform: scale(1.3); } to { transform: scale(1); } }

  /* a passenger walking between the platform and a train door */
  .walker { position: absolute; z-index: 2; display: flex; align-items: center; justify-content: center; line-height: 1; pointer-events: none; }
  .walker span { display: inline-block; animation: waddle .26s ease-in-out infinite alternate; }
  .walker.bye::after { content: "👋"; position: absolute; right: -10px; top: -12px; font-size: 16px; }
  @keyframes waddle { from { transform: rotate(-8deg) translateY(0); } to { transform: rotate(8deg) translateY(-5px); } }

  /* running count above the train while people get on/off */
  .tally {
    position: absolute; z-index: 2; top: 10px; left: 50%; transform: translateX(-50%);
    background: #fff; color: var(--line); border-radius: 999px; padding: 4px 20px; font-size: 30px; font-weight: bold;
    box-shadow: var(--shadow); opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap;
  }
  .tally.show { opacity: 1; }
  .tally.done { color: var(--good); outline: 4px solid var(--good); }
  .tally.bump { animation: bump .3s; }
  @keyframes bump { 50% { transform: translateX(-50%) scale(1.3); } }

  /* little train running along a track (home + end screens) */
  .mini-track { position: relative; height: 40px; overflow: hidden; border-bottom: 6px solid #8b7b6b; }
  .mini-train { position: absolute; bottom: 4px; display: flex; gap: 4px; animation: run 7s linear -2.5s infinite; }
  .mini-train span { width: 44px; height: 26px; background: var(--line); border-radius: 6px; box-shadow: inset 0 -6px 0 rgba(0,0,0,.18), inset 0 7px 0 #fff; }
  .mini-train span:last-child { border-radius: 6px 18px 6px 6px; }
  @keyframes run { from { left: -160px; } to { left: 100%; } }

  .story { text-align: center; font-size: 19px; margin: 0; line-height: 1.35; }
  .equation { min-height: 1.2em; text-align: center; font-size: clamp(44px, 13vw, 72px); font-weight: bold; letter-spacing: 2px; margin: 0; }
  .equation .q { display: inline-block; min-width: 1.1em; color: var(--line); border-bottom: 6px dashed var(--line); }
  .answers { min-height: 86px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .ans {
    background: var(--card); border-radius: 22px; font-size: clamp(40px, 12vw, 60px); font-weight: bold;
    padding: 10px 0; box-shadow: 0 6px 0 rgba(0,0,0,.18); border: 4px solid var(--line);
  }
  .ans:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.18); }
  .ans.wrong { background: #ffe1dd; border-color: var(--bad); opacity: .5; animation: shake .4s; }
  .ans.right { background: #d9f7e1; border-color: var(--good); }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
  .feedback { text-align: center; font-size: 22px; min-height: 30px; margin: 0; font-weight: bold; }
  .feedback.good { color: var(--good); }
  .feedback.bad { color: var(--bad); }
  .tip { text-align: center; color: var(--muted); font-size: 14px; margin: 0; }

  /* ---------- End ---------- */
  #end { text-align: center; justify-content: center; }
  #end .pill { flex: none; }
  .big-emoji { font-size: 90px; animation: bounce 1s infinite alternate; }
  @keyframes bounce { to { transform: translateY(-14px); } }
  .end-stars { font-size: 34px; letter-spacing: 2px; word-break: break-all; }
  .confetti { position: fixed; top: -40px; font-size: 28px; pointer-events: none; animation: fall linear forwards; z-index: 9; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }

  @media (prefers-reduced-motion: reduce) {
    .pax, .door i { transition: none; }
    .walker span, .pax.pop, .tally.bump { animation: none; }
    .big-emoji, .confetti, .mini-train, .start-train, .start-train.leaving, .st-car, .st-wheels i, .start-hint span { animation: none !important; }
  }
</style>
</head>
<body>

<!-- HOME -->
<section id="home" class="screen active">
  <h1>🚆 MRT Math Express</h1>
  <p class="sub">Ride the train. Help the passengers. Count to the last stop!</p>
  <button class="pill music-pill" id="homeMusicBtn">🎵 Music: on</button>

  <h2>1. Pick your MRT line</h2>
  <div class="lines" id="lineList"></div>

  <h2>2. What happens at each station?</h2>
  <div class="choices" id="modeList">
    <button class="pill sel" data-mode="add">➕ Get on<small>adding</small></button>
    <button class="pill" data-mode="sub">➖ Get off<small>taking away</small></button>
    <button class="pill" data-mode="mix">🔀 Both<small>mixed</small></button>
  </div>

  <p class="start-hint">Tap the train to start! <span>👇</span></p>
  <div class="start-track">
    <button class="start-train" id="goBtn" aria-label="All aboard! Tap the train to start">
      <span class="st-car" aria-hidden="true"><i class="st-win"></i><i class="st-win"></i></span>
      <span class="st-car st-lead"><span class="st-text">All aboard!</span><i class="st-cab" aria-hidden="true"></i></span>
      <span class="st-wheels" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
    </button>
  </div>
</section>

<!-- GAME -->
<section id="game" class="screen">
  <div class="topbar">
    <button class="icon-btn" id="homeBtn" aria-label="Back to start">🏠</button>
    <div class="title-chip" id="lineTitle">North South Line</div>
    <button class="icon-btn" id="musicBtn" aria-label="Music on or off">🎵</button>
    <button class="icon-btn" id="soundBtn" aria-label="Sound on or off">🔊</button>
  </div>

  <div class="route" id="route"></div>

  <div class="signrow">
    <div class="sign"><span class="lbl" id="signLbl">Now at</span><span id="stationName">Station</span></div>
    <div class="stars" id="starCount">⭐ 0</div>
  </div>

  <div class="scene" id="scene">
    <div class="layer far" id="layerFar"></div>
    <div class="layer near" id="layerNear"></div>
    <div class="train open" id="train">
      <div class="door"><i></i><i></i></div>
      <div class="window" id="carriage"></div>
      <div class="door"><i></i><i></i></div>
    </div>
    <div class="wheels" id="wheels"><i></i><i></i><i></i><i></i></div>
    <div class="rail" id="rail"></div>
    <div class="platform" id="platform"></div>
    <div class="tally" id="tally"></div>
    <div class="tunnel" id="tunnel"></div>
  </div>

  <p class="story" id="story"></p>
  <p class="equation" id="equation"></p>
  <div class="answers" id="answers"></div>
  <p class="feedback" id="feedback"></p>
  <p class="tip">Tip: tap the people to count them! Tap 🔊 to hear the question.</p>
  <button class="icon-btn" id="sayBtn" style="align-self:center;width:auto;padding:0 18px" aria-label="Read the question aloud">🔊 Hear it again</button>
</section>

<!-- END -->
<section id="end" class="screen">
  <div class="big-emoji">🏆</div>
  <h1 id="endTitle">You made it!</h1>
  <p class="sub" id="endText"></p>
  <div class="end-stars" id="endStars"></div>
  <div class="mini-track" aria-hidden="true"><div class="mini-train"><span></span><span></span><span></span></div></div>
  <button class="go" id="againBtn">Ride again 🔁</button>
  <button class="pill" id="otherBtn">🗺️ Choose another line</button>
</section>

<script>
(() => {
  // Real station names (in order) for a short trip on each line.
  const LINES = [
    { id: "NS", name: "North South Line", color: "#D42E12",
      stations: ["Woodlands", "Yishun", "Ang Mo Kio", "Bishan", "Toa Payoh", "Novena", "Newton", "Orchard", "City Hall", "Marina Bay"] },
    { id: "EW", name: "East West Line", color: "#009645",
      stations: ["Pasir Ris", "Tampines", "Bedok", "Paya Lebar", "Bugis", "City Hall", "Raffles Place", "Outram Park", "Clementi", "Jurong East"] },
    { id: "NE", name: "North East Line", color: "#9900AA",
      stations: ["HarbourFront", "Outram Park", "Chinatown", "Dhoby Ghaut", "Little India", "Farrer Park", "Serangoon", "Hougang", "Sengkang", "Punggol"] },
    { id: "CC", name: "Circle Line", color: "#E8930C",
      stations: ["Dhoby Ghaut", "Promenade", "Stadium", "Paya Lebar", "Serangoon", "Bishan", "Botanic Gardens", "Buona Vista", "Kent Ridge", "HarbourFront"] },
    { id: "DT", name: "Downtown Line", color: "#005EC4",
      stations: ["Bukit Panjang", "Beauty World", "Botanic Gardens", "Newton", "Little India", "Bugis", "Promenade", "Bayfront", "Chinatown", "Expo"] },
    { id: "TE", name: "Thomson-East Coast Line", color: "#9D5B25",
      stations: ["Woodlands North", "Woodlands", "Springleaf", "Caldecott", "Stevens", "Orchard", "Great World", "Outram Park", "Maxwell", "Marina Bay"] },
  ];
  const PEOPLE = ["🧑","👩","👨","🧒","👧","👦","👵","👴","🧕","👱","🧔","👩‍🦱","👨‍🦳","🧑‍🦰"];
  const CHEERS = ["Great job!", "Well done!", "Super!", "You got it!", "Shiok!", "Awesome!", "Fantastic!"];

  const $ = id => document.getElementById(id);
  const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = rand(0, i); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };

  // ---- saved progress (best-effort) ----
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  let badges = store.get("mrtBadges", {});
  let soundOn = store.get("mrtSound", true);
  let musicOn = store.get("mrtMusic", true);

  // ---- state ----
  const S = { gen: 0, line: LINES[0], mode: "add", at: 0, stars: 0, q: null, tries: 0, busy: false, counted: 0, last: "" };

  // ---- audio ----
  let ac;
  function audio() {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
    return ac;
  }
  function tone(freq, start, dur, type = "sine", vol = 0.18) {
    if (!soundOn) return;
    try {
      audio();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = freq;
      const t = ac.currentTime + start;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.05);
    } catch {}
  }
  const sfx = {
    chime() { tone(784, 0, .5); tone(659, .35, .5); tone(523, .7, .7); },
    right() { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .09, .25, "triangle")); },
    wrong() { tone(220, 0, .3, "sine", .12); },
    tick() { tone(880, 0, .08, "square", .05); },

    const train = $("train"), wheels = [...$("wheels").children], tunnel = $("tunnel");
    const marker = $("routeMarker"), done = $("routeDone");

    const speed = p => (p < .5 ? 12 * p * p : 3 * Math.pow(-2 * p + 2, 2)) / 3; // 0..1

      [doorX, doorY - 6, 0.4, 0, 1],
    ], dur).then(() => {
      if (gen !== S.gen) return;
      p.classList.remove("board");
      p.classList.add("pop");
      $("carriage").appendChild(p);
      onIn();
    });
  }

  // Get off: go to the nearest door, step down onto the platform, then wave and walk away.
  function alightOne(p, gen, onOut) {
    const r = rel(p), d = nearestDoor(r), plat = rel($("platform")), W = $("scene").clientWidth;
    const doorX = d.x + d.w / 2 - r.w / 2, doorY = d.y + d.h - r.h - 4;
    const platY = plat.y + plat.h / 2 - r.h / 2;
    const exitX = d.x + d.w / 2 < W / 2 ? -r.w - 20 : W + 20;
    const toDoor = slow(500), down = slow(450), away = slow(Math.min(1300, 400 + Math.abs(exitX - doorX) * 3.5));
    const dur = toDoor + down + away;
    leaveGap(p);
    setTimeout(() => gen === S.gen && onOut(), toDoor + down);
    return walk(r, p, [
      [r.x, r.y, 1, 1, 0],
      [doorX, doorY, 1, 1, toDoor / dur],
      [doorX, platY, 1, 1, (toDoor + down) / dur],
      [exitX, platY, 1, 1, 1],
    ], dur, "bye");
  }

  // One passenger at a time (slightly overlapping). The bubble counts how many get on/off
  // (➕ 1, 2, 3), not the total, so the answer isn't given away.
  async function movePassengers(q, gen) {
    const sign = q.op === "+" ? "➕" : "➖";
    let k = 0;
    setTally(`${sign} 0`);
    const group = q.op === "+"
      ? [...$("platform").querySelectorAll(".pax")]
      : [...$("carriage").querySelectorAll(".pax.leaving")];
    const step = () => { k++; setTally(`${sign} ${k}`); sfx.tick(); say(String(k)); };
    const jobs = [];
    for (const p of group) {
      if (gen !== S.gen) return;
      jobs.push(q.op === "+" ? boardOne(p, gen, step) : alightOne(p, gen, step));
      await sleep(slow(800));
    }
    await Promise.all(jobs);
  }

  function finish() {
    const total = S.line.stations.length - 1;
    const last = S.line.stations[total];
    badges[S.line.id] = Math.max(badges[S.line.id] || 0, S.stars);
    store.set("mrtBadges", badges);
    $("endTitle").textContent = `You reached ${last}!`;
    $("endText").textContent = `You helped the passengers on the ${S.line.name}. You got ${S.stars} out of ${total} stars on the first try!`;
    $("endStars").textContent = "⭐".repeat(S.stars) + "☆".repeat(total - S.stars);
    show("end");
    sfx.chime(); setTimeout(sfx.right, 900);
    say(`Hooray! You reached ${last}! You got ${S.stars} stars!`);
    for (let i = 0; i < 30; i++) {
      const c = document.createElement("div");
      c.className = "confetti";
      c.textContent = pick(["🎉","⭐","🎈","🚆","✨"]);
      c.style.left = rand(0, 95) + "vw";
      c.style.animationDuration = rand(25, 45) / 10 + "s";
      c.style.animationDelay = rand(0, 15) / 10 + "s";
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 6500);
    }
  }

  // ---- wiring ----
  // Start train: pulls in on load and whenever the home screen comes back, drives off when tapped.
  const startTrain = $("goBtn");
  function pullInStartTrain() {
    startTrain.classList.remove("leaving", "waiting");
    startTrain.disabled = false;
    startTrain.style.animation = "none"; void startTrain.offsetWidth; startTrain.style.animation = "";
    if (reduceMotion) startTrain.classList.add("waiting");
  }
  startTrain.addEventListener("animationend", e => {
    if (e.target === startTrain && !startTrain.classList.contains("leaving")) startTrain.classList.add("waiting");
  });
  startTrain.onclick = () => {
    if (startTrain.disabled) return;
    startTrain.disabled = true;
    startTrain.classList.remove("waiting");
    startTrain.classList.add("leaving");
    sfx.toot();
    setTimeout(startGame, reduceMotion ? 150 : 1000);
  };
  pullInStartTrain();
  $("againBtn").onclick = startGame;
  $("otherBtn").onclick = () => { renderLines(); show("home"); pullInStartTrain(); };
  $("homeBtn").onclick = () => { S.gen++; try { speechSynthesis.cancel(); } catch {} renderLines(); show("home"); pullInStartTrain(); };
  $("sayBtn").onclick = speakQ;
  $("musicBtn").onclick = toggleMusic;
  $("homeMusicBtn").onclick = e => { e.stopPropagation(); toggleMusic(); };
  // Browsers only allow sound after the first tap, so start the music then.
  // Phones only allow sound after a real tap, so unlock everything on the first few taps.
  const UNLOCK_EVENTS = ["pointerup", "touchend", "click", "keydown"];
  UNLOCK_EVENTS.forEach(ev => document.addEventListener(ev, unlockAudio, true));
  syncMusicButtons();
  $("soundBtn").onclick = () => {
    soundOn = !soundOn; store.set("mrtSound", soundOn);
    $("soundBtn").textContent = soundOn ? "🔊" : "🔇";
    if (!soundOn) try { speechSynthesis.cancel(); } catch {}
  };

  renderLines();
})();
</script>
</body>
</html>
